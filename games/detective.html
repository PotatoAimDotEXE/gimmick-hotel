<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escape Room – Effective Detective</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/detective.css" />
  <link rel="stylesheet" href="../css/ui.css" />
</head>
<body class="game">
  <header class="topbar">
    <a class="logo" href="../hallway.html">&larr; HALLWAY</a>
    <span>Room 01 · Effective Detective</span>
    <span class="muted"><span id="topbar-case"></span> · <span class="key-hint">Esc = back</span></span>
  </header>

  <main class="game-stage">
    <div class="dl-stage dl-bg"><!-- background for every screen: assets/detective/effective-detective-background.png -->

      <!-- ============ 1. GAME MENU ============ -->
      <section class="dl-screen dl-home" id="screen-menu">
        <h1 class="dl-title dl-home-title">Effective Detective</h1>

        <div class="dl-home-buttons">
          <button class="menu-btn primary" id="btn-daily">Case of the Day</button>
          <div class="dl-home-side">
            <button class="menu-btn" data-soon="Detective's Backlog">Detective's Backlog</button>
            <button class="menu-btn" data-soon="Party mode">Party Mode</button>
          </div>
        </div>
        <p class="dl-note" id="menu-note" aria-live="polite"></p>

        <!-- not shown in this layout, kept so the scores/fact code still has somewhere to write -->
        <aside class="dl-side" hidden>
          <ol id="dl-leaderboard"></ol>
          <p id="dl-fact"></p>
        </aside>
      </section>

      <!-- ============ 2. CLASSIFIED FOLDER + DIFFICULTY ============ -->
      <section class="dl-screen" id="screen-folder" hidden>
        <div class="dl-folder-row">
          <button class="dl-folder" id="btn-open-folder" aria-label="Open the case file">
            <span class="dl-stamp">CLASSIFIED</span>
            <span class="dl-case-no" id="folder-case-no">CASE #000</span>
            <span class="dl-case-title" id="folder-title"></span>
            <span class="dl-case-date" id="folder-date"></span>
            <span class="dl-hint">click to open</span>
          </button>

          <fieldset class="dl-difficulty" id="difficulty">
            <legend>Difficulty</legend>
            <label><input type="radio" name="difficulty" value="easy" /> Easy <small>(3 people)</small></label>
            <label><input type="radio" name="difficulty" value="medium" /> Medium <small>(4 people)</small></label>
            <label><input type="radio" name="difficulty" value="hard" /> Hard <small>(5 people)</small></label>
            <p class="dl-note">Locked once you open the file.</p>
          </fieldset>
        </div>
        <button class="dl-back" data-go="menu">&larr; Back to menu</button>
      </section>

      <!-- ============ 3. INVESTIGATION (file / suspects / suspect) ============ -->
      <section class="dl-screen" id="screen-investigate" hidden>
        <nav class="dl-toolbar">
          <div class="dl-tabs" role="tablist">
            <button role="tab" data-view="file">Case File</button>
            <button role="tab" data-view="suspects">People of interest</button>
          </div>
          <div class="dl-toolbar-right">
            <button data-go="menu">Menu</button>
            <button class="dl-answer-btn" id="btn-answer">✎ Answer</button>
          </div>
        </nav>

        <!-- the case question: big, so it is always easy to spot -->
        <p class="dl-question" id="case-question"></p>

        <!-- 3a. opened case file -->
        <div class="dl-view" id="view-file">
          <!-- the case file is a folder like the paralegal one: report and evidence on
               separate sheets, read sheets go onto the (dimmed) left flap -->
          <div class="df-desk" id="file-desk">
            <div class="df-stack" id="file-stack">
              <div class="df-flap" aria-hidden="true"></div>
              <div class="df-board" aria-hidden="true"></div>
              <div class="df-sheet" style="--tilt: 2.2deg" aria-hidden="true"></div>
              <div class="df-sheet" style="--tilt: -2.4deg" aria-hidden="true"></div>
              <!-- pages are added here by detective.js -->
            </div>
            <button class="df-arrow prev" id="file-prev" aria-label="Previous page">◀</button>
            <button class="df-arrow next" id="file-next" aria-label="Next page">▶</button>
          </div>
        </div>

        <!-- 3b. suspect board -->
        <div class="dl-view" id="view-suspects" hidden>
          <div class="dl-board">
            <p class="dl-board-title">People of interest</p>
            <p class="dl-board-label">Click a person to read their interview</p>
            <div class="dl-suspects" id="suspect-list"></div>
          </div>
        </div>

        <!-- 3c. single suspect file -->
        <div class="dl-view" id="view-suspect" hidden>
          <div class="dl-book">
            <article class="dl-page dl-page-profile" id="suspect-left"></article>
            <article class="dl-page" id="suspect-right"></article>
          </div>
          <div class="dl-suspect-actions">
            <button data-view="suspects">&larr; People of interest</button>
            <span class="key-hint">← → = previous / next person</span>
            <button id="btn-accuse">Choose this person</button>
          </div>
        </div>
      </section>

      <!-- ============ 4. RESULT ============ -->
      <section class="dl-screen" id="screen-result" hidden>
        <!-- score report card (assets/ui/score-report.png) -->
        <div class="dl-report">
          <h1 class="dl-title" id="result-title">Case Closed</h1>
          <div class="dl-result" id="result-body"></div>
          <div class="actions">
            <button id="btn-copy">Copy result</button>
            <button data-go="menu">Game menu</button>
            <a href="../hallway.html"><button>Back to hallway</button></a>
          </div>
          <p class="dl-note" id="result-next"></p>
          <button class="dl-dev" id="btn-dev-reset" hidden>[dev] reset today's case</button>
        </div>
      </section>
    </div>
  </main>

  <!-- ============ ANSWER POP-UP ============ -->
  <dialog class="modal dl-answer" id="answer-dialog">
    <form method="dialog" id="answer-form">
      <h2>Your verdict</h2>

      <fieldset>
        <legend class="dl-question dl-question-small" id="answer-question">Who is it?</legend>
        <div class="dl-choices" id="answer-choices"></div>
      </fieldset>

      <label for="answer-reason" id="answer-instructions">Explain your reasoning using evidence from the files.</label>
      <textarea id="answer-reason" rows="6" maxlength="1200"
        placeholder="I think it's ___ because..."></textarea>
      <div class="dl-count"><span id="answer-count">0</span>/1200</div>

      <p class="dl-note" id="answer-error" aria-live="polite"></p>

      <div class="actions">
        <button type="button" id="btn-answer-close">Close (keeps your answer)</button>
        <button type="button" id="btn-submit" class="primary">Submit</button>
      </div>
    </form>
  </dialog>

  <script src="../js/main.js"></script>
  <script src="../js/detective/cases.js"></script>
  <script src="../js/detective/grader.js"></script>
  <script src="../js/detective/detective.js"></script>
</body>
</html>
